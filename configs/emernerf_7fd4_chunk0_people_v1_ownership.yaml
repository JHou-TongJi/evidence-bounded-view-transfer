# Person pilot: tracks 61/62/66 are deformable, so this is a native 4D field,
# not a rigid/canonical Gaussian actor.  Each actor is sampled uniformly, and
# cross-left actor pixels remain an RGB holdout while its safe background is
# context.  Raw conservative source masks only; SAM2-only masks stay disabled.
init_from: /data/zrz/Cross-Vehicle/outputs/emernerf/runs/ncore-emernerf/track67-v2-masked-context-pilot2000-v2/checkpoint_02000.pth

data:
  dataset: ncore
  ray_bundle: /data/zrz/Cross-Vehicle/outputs/emernerf/7fd4d554/chunk0-people61-62-66-160-183-v1-native-rays.json
  ray_batch_size: 2048
  preload_device: cuda
  pixel_source:
    load_size: [270, 480]
    downscale: 1
    num_cams: 7
    load_rgb: true
    load_sky_mask: false
    load_dynamic_mask: true
    load_features: false
    sampler: {buffer_downscale: 16, buffer_ratio: 0.0}
    ncore_sampling:
      enable: true
      actor_ray_fraction: 0.30
      actor_ring_ray_fraction: 0.15
      actor_ring_width_pixels: 2
      actor_core_erosion_pixels: 1
      actor_track_balanced: true
      images_per_kind: 3
      background_rgb_coef: 1.0
      ring_rgb_coef: 1.0
      actor_rgb_coef: 1.25
      actor_static_ownership: true
      outside_dynamic_opacity_coef: 0.10
      ring_dynamic_opacity_coef: 0.25
      actor_opacity_floor: 0.0
      actor_opacity_coef: 0.0
      actor_alpha_core_target: 0.80
      actor_alpha_edge_target: 0.35
      actor_alpha_target_coef: 0.25
  lidar_source:
    load_lidar: true
    lidar_downsample_factor: 4
    lidar_percentile: 0.02

nerf:
  unbounded: true
  propnet: {num_samples_per_prop: [64, 32], near_plane: 0.1, far_plane: 160.0}
  sampling: {num_samples: 48}
  model:
    xyz_encoder: {n_levels: 8, max_resolution: 4096, log2_hashmap_size: 18}
    dynamic_xyz_encoder: {n_levels: 8, max_resolution: 4096, log2_hashmap_size: 17}
    head:
      enable_img_embedding: false
      enable_cam_embedding: false
      enable_sky_head: false
      enable_dynamic_branch: true
      enable_shadow_head: false
      enable_flow_branch: true
      enable_temporal_interpolation: true

supervision:
  depth:
    enable: true
    line_of_sight: {enable: true, start_iter: 100, decay_steps: 500, start_epsilon: 5.0, end_epsilon: 2.0}
  dynamic: {loss_coef: 0.002}
optim: {num_iters: 500, lr: 0.005, cache_rgb_freq: 1000000}
logging: {vis_freq: 1000000, print_freq: 25, saveckpt_freq: 250}
render: {render_chunk_size: 8192, render_low_res: false, render_full: false, render_test: false}
