# Run this file from external/street_gaussians.  It consumes the NCore proxy
# dataset made by nurec-gs-street-dataset and exports only rigid vehicle actors.
task: ncore_street
exp_name: 7fd4_chunk0_rigid_vehicle_v4_masked
gpus: [-1]  # respect CUDA_VISIBLE_DEVICES supplied by the command
to_cuda: true
source_path: /data/zrz/Cross-Vehicle/outputs/street_gaussian/datasets/7fd4d554/chunk0-v4
model_path: /data/zrz/Cross-Vehicle/outputs/street_gaussian/models/7fd4d554/chunk0-rigid-vehicle-v4-masked

data:
  type: NCore
  white_background: false
  cameras: [0, 1, 2, 3, 4]
  split_train: 1
  split_test: -1
  extent: 80
  box_scale: 1.0

model:
  gaussian:
    sh_degree: 1
    fourier_dim: 1
    flip_prob: 0.0
  nsg:
    include_bkgd: true
    include_obj: true
    include_sky: false
    opt_track: false  # required for exact root-renderer export in this first bridge
  sky:
    white_background: false

train:
  iterations: 30000
  test_iterations: [7000, 14000, 21000, 30000]
  save_iterations: [7000, 14000, 21000, 30000]
  checkpoint_iterations: [7000, 14000, 21000, 30000]

optim:
  semantic_lr: 0.01
  densification_interval: 100
  densify_from_iter: 500
  densify_until_iter: 15000
  densify_grad_threshold_bkgd: 0.0006
  densify_grad_threshold_obj: 0.0002
  prune_actor_box: false
  min_actor_gaussians: 512
  lambda_dssim: 0.2
  lambda_reg: 0.0
  lambda_depth_lidar: 0.0
  lambda_sky: 0.0

render:
  fps: 10
