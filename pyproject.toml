[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "instant-nurec-gs-renderer"
version = "0.1.0"
description = "Render InstantNuRec/Graphdeco 3D Gaussian PLY scenes from world or NCore camera trajectories."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.0",
  "plyfile>=1.0",
  "torch>=2.1",
  "gsplat>=1.5",
]

[project.optional-dependencies]
ncore = [
  "nvidia-ncore==18.7.0",
  "universal-pathlib>=0.2",
]

sky = [
  "transformers==4.57.1",
  "huggingface-hub==0.36.2",
  "safetensors>=0.4.3",
]
depth = [
  "transformers==4.57.1",
  "huggingface-hub==0.36.2",
  "safetensors>=0.4.3",
  "scipy>=1.10",
]
dev = ["pytest>=8.0"]
opacity = ["scipy>=1.10"]
instance = ["scipy>=1.10"]
presentation = ["opencv-python-headless>=4.8"]

[project.scripts]
nurec-gs-render = "nurec_gs_renderer.cli:main"
nurec-sky-build = "nurec_gs_renderer.sky_cli:main"
nurec-gs-color-bake = "nurec_gs_renderer.color_bake_cli:main"
nurec-gs-decontaminate = "nurec_gs_renderer.decontaminate_cli:main"
nurec-gs-sequence-compare = "nurec_gs_renderer.sequence_compare:main"
nurec-gs-dynamic-evaluate = "nurec_gs_renderer.dynamic_evaluate:main"
nurec-gs-opacity-decontaminate = "nurec_gs_renderer.opacity_decontaminate_cli:main"
nurec-gs-static-leakage = "nurec_gs_renderer.static_leakage_cli:main"
nurec-gs-clean-static-masks = "nurec_gs_renderer.clean_static_masks_cli:main"
nurec-gs-dynamic-associate = "nurec_gs_renderer.dynamic_associate_cli:main"
nurec-gs-canonical-actors = "nurec_gs_renderer.canonical_actor_cli:main"
nurec-gs-dynamic-forensics = "nurec_gs_renderer.dynamic_forensics:main"
nurec-gs-dynamic-track-audit = "nurec_gs_renderer.dynamic_track_audit_cli:main"
nurec-gs-street-dataset = "nurec_gs_renderer.street_dataset_cli:main"
